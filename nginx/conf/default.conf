server {
    listen 80;
    server_name demo.medimate.health.vn www.demo.medimate.health.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
    
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

server {
    listen 443 ssl;
    server_name demo.medimate.health.vn www.demo.medimate.health.vn;

    ssl_certificate /etc/letsencrypt/live/demo.medimate.health.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.medimate.health.vn/privkey.pem;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}