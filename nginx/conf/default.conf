server {
    listen 80;
    server_name demo.medimate.health.vn www.demo.medimate.health.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tự động đẩy mọi người dùng từ http sang https
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name demo.medimate.health.vn www.demo.medimate.health.vn;

    # ĐƯỜNG DẪN CHỨNG CHỈ (Kiểm tra kỹ tên folder)
    ssl_certificate /etc/letsencrypt/live/demo.medimate.health.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.medimate.health.vn/privkey.pem;

    # Cấu hình bảo mật thêm (tùy chọn nhưng nên có)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}